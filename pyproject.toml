[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dentdeid"
version = "0.1.0"
description = "Open, tested de-identification for dental images: DICOM PS3.15 headers, burned-in text, EXIF/GPS, file names, faces and CBCT face risk."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Hossein Boustani Hezarani" }]
keywords = [
  "de-identification", "anonymization", "pseudonymization", "dental imaging", "dentistry",
  "DICOM", "PS3.15", "burned-in text", "HIPAA", "GDPR", "CBCT", "panoramic radiograph",
  "privacy", "medical imaging", "dental AI",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Healthcare Industry",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Topic :: Security",
  "Operating System :: OS Independent",
]
dependencies = [
  "pydicom>=3.0.1",                # 3.0.0 tries to download example files on import
  "numpy>=1.23",
  "Pillow>=11.1",                  # older Exif.get_ifd() drops new sub-IFDs (synthetic GPS/serials)
  "opencv-python-headless>=4.10,<5", # face detection in photographs (4.10+: NumPy 2 support; OpenCV 5 removed the Haar cascades)
]

[project.optional-dependencies]
faces = []                         # kept for backwards compatibility; OpenCV is now a core dependency
ocr = ["pytesseract>=0.3.10"]      # also needs the Tesseract program: https://tesseract-ocr.github.io
all = ["pytesseract>=0.3.10"]
test = ["pytest>=7", "scikit-image>=0.21"]

[project.urls]
Homepage = "https://github.com/Hezarani/dentdeid"
Documentation = "https://hezarani.github.io/dentdeid/"
Repository = "https://github.com/Hezarani/dentdeid"
"Live demo" = "https://hezarani.github.io/dentdeid/"
Issues = "https://github.com/Hezarani/dentdeid/issues"
Changelog = "https://github.com/Hezarani/dentdeid/blob/main/CHANGELOG.md"

[project.scripts]
dentdeid = "dentdeid.cli:main"

[tool.setuptools]
packages = ["dentdeid", "dentdeid.data", "dentdeid.dicom", "dentdeid.imaging", "dentdeid.synth"]

[tool.setuptools.package-data]
dentdeid = ["data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
