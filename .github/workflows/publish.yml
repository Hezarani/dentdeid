name: Publish to PyPI

# Publishes DentDeID to PyPI automatically whenever a GitHub Release is published (or when started by
# hand from the Actions tab) — but only after the full test suite has passed on Python 3.10-3.13 and,
# for releases, the tag matches the version.
# Uses PyPI "Trusted Publishing" (OpenID Connect): no API token or password is stored anywhere.
# One-time setup on pypi.org: Account → Publishing → Add a pending publisher with
#   PyPI project name = dentdeid, owner = Hezarani, repository = dentdeid,
#   workflow = publish.yml, environment = pypi.

on:
  release:
    types: [published]
  workflow_dispatch:      # "Run workflow" button: publishes the version in pyproject.toml (e.g. a release
                          # that was created before this workflow existed)

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  build:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Tag must match the package version
        if: github.event_name == 'release'
        run: test "v$(grep -Po '^version = "\K[^"]+' pyproject.toml)" = "${GITHUB_REF_NAME}"
      - name: Build and check the distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # required for PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
