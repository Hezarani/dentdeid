name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:        # publish.yml runs these same tests before anything is uploaded
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7          # for the Python <-> JavaScript detector parity tests
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test]"
      - run: python -m pytest -q
